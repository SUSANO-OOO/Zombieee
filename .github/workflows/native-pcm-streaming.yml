name: Native PCM HTTP Streaming Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/native-pcm-streaming.yml'
      - 'scripts/v177-native-pcm-origin.mjs'
      - 'scripts/v177-native-pcm-probe.mjs'
      - 'scripts/v177-native-pcm-browser.mjs'
      - 'tests/v177-native-pcm.test.mjs'

permissions:
  contents: read

concurrency:
  group: native-pcm-streaming-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  native-pcm-streaming:
    name: Native WebKit Ordinary HTTP PCM
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify PCM and HTTP contracts without playing audio
        run: node --test tests/v177-native-pcm.test.mjs
      - name: Install the pinned native WebKit runtime
        run: |
          npm ci --prefix scripts/pwa-native-runtime
          node scripts/pwa-native-runtime/node_modules/playwright/cli.js install webkit
      - name: Compare finite and live native WAV playback on the hosted runner
        env:
          V177_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          V177_NATIVE_PCM_OUT: outputs/v177-native-pcm
        run: node scripts/v177-native-pcm-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v177-native-pcm-streaming
          path: outputs/v177-native-pcm
          retention-days: 7
          if-no-files-found: error
