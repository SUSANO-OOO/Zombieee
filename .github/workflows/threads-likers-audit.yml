name: Threads liker audit (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - tools/threads_likers_audit.py
      - .github/workflows/threads-likers-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Exhaust public liker paths and inspect public Actor source
        run: python tools/threads_likers_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threads-liker-audit-${{ github.run_id }}
          path: |
            tmp_threads_audit/liker_graphql_test.json
            tmp_threads_audit/apify_actor_source.json
          retention-days: 3
