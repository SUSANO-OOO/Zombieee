name: CI

on:
  pull_request:
    branches:
      - main
      - "integration/**"
      - "codex/v1.0.0-sol-design"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: PR Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout synthetic PR merge
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify PR provenance
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PR_BASE_SHA"
          test -n "$PR_HEAD_SHA"
          case "$PR_BASE_REF" in
            main|integration/*|codex/v1.0.0-sol-design) ;;
            *) echo "unsupported PR base ref: $PR_BASE_REF" >&2; exit 1 ;;
          esac
          PR_MERGE_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$PR_BASE_SHA" "$PR_MERGE_SHA"
          git merge-base --is-ancestor "$PR_HEAD_SHA" "$PR_MERGE_SHA"
          {
            echo "base_ref=$PR_BASE_REF"
            echo "base_sha=$PR_BASE_SHA"
            echo "head_sha=$PR_HEAD_SHA"
            echo "merge_sha=$PR_MERGE_SHA"
          } | tee pr-provenance.txt

      - name: Upload PR provenance
        uses: actions/upload-artifact@v4
        with:
          name: pr-verify-provenance
          path: pr-provenance.txt
          if-no-files-found: error
          retention-days: 14

      - name: Check patch whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run lint

      - name: Validate production content
        run: npm run content:validate

      - name: Build production application
        run: npm run build

      - name: Test
        run: npm test

      - name: Install focused browser engines
        run: npx playwright install --with-deps chromium

      - name: Build exact base and candidate PWA sites for partial-update QA
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          old_source="$RUNNER_TEMP/pwa-old-source"
          old_site="$RUNNER_TEMP/pwa-old-site"
          git worktree add --detach "$old_source" "$PR_BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$old_source/node_modules"

          (
            cd "$old_source"
            npm run build
            old_version="$(node --input-type=module --eval 'import("./app/releaseIdentity.js").then(({ RELEASE_VERSION }) => process.stdout.write(RELEASE_VERSION))')"
            GITHUB_PAGES_BASE_PATH=/Zombieee \
            GITHUB_PAGES_RELEASE_VERSION="$old_version" \
            GITHUB_PAGES_RELEASE_SHA="$PR_BASE_SHA" \
            GITHUB_PAGES_REQUEST_ID=pr-partial-update-old \
            GITHUB_PAGES_ISSUE_NUMBER=156 \
              node scripts/build-github-pages.mjs
          )
          cp -a "$old_source/_site" "$old_site"

          candidate_version="$(node --input-type=module --eval 'import("./app/releaseIdentity.js").then(({ RELEASE_VERSION }) => process.stdout.write(RELEASE_VERSION))')"
          GITHUB_PAGES_BASE_PATH=/Zombieee \
          GITHUB_PAGES_RELEASE_VERSION="$candidate_version" \
          GITHUB_PAGES_RELEASE_SHA="$PR_HEAD_SHA" \
          GITHUB_PAGES_REQUEST_ID=pr-partial-update-candidate \
          GITHUB_PAGES_ISSUE_NUMBER=156 \
            node scripts/build-github-pages.mjs

      - name: Reproduce and recover the partial-failed existing PWA (Chromium)
        env:
          PWA_PARTIAL_UPDATE_OLD_ROOT: ${{ runner.temp }}/pwa-old-site
          PWA_PARTIAL_UPDATE_CANDIDATE_ROOT: ${{ github.workspace }}/_site
          PWA_PARTIAL_UPDATE_BROWSER: chromium
          PWA_PARTIAL_UPDATE_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/pwa-partial-update/chromium
        run: npm run qa:pwa-partial-update

      - name: Capture Issue 156 canonical HUD evidence (Chromium)
        env:
          V099_FINAL_REMEDIATION_QA_ENGINES: chromium
          V099_FINAL_REMEDIATION_QA_CASES: hud
          V099_PAGES_EXPECTED_VERSION: 0.9.9.5
          V099_PAGES_EXPECTED_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for viewport in 667x375 736x414 844x390 844x340 932x430 1280x720; do
            export V099_FINAL_REMEDIATION_QA_VIEWPORTS="$viewport"
            export V099_FINAL_REMEDIATION_QA_EVIDENCE_DIR="${{ github.workspace }}/issue156-evidence/canonical-hud/chromium/$viewport"
            node scripts/run-v099-final-bounded-against-pages.mjs _site
          done

      - name: Capture Issue 156 final-canvas deployment evidence (Chromium)
        env:
          V099_FINAL_REMEDIATION_QA_ENGINES: chromium
          V099_FINAL_REMEDIATION_QA_VIEWPORTS: 667x375,736x414,844x390,844x340,932x430,1280x720
          V099_FINAL_REMEDIATION_QA_CASES: deployment
          V099_FINAL_REMEDIATION_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/deployment/chromium
        run: node scripts/run-browser-qa-with-server.mjs scripts/v099-final-remediation-browser-smoke.mjs

      - name: Capture Issue 156 safe-area, portrait, and metadata evidence
        env:
          ISSUE156_REMEDIATION_QA_ENGINES: chromium
          ISSUE156_REMEDIATION_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/presentation
        run: npm run qa:issue156-remediation

      - name: Capture Issue 156 physical-width records evidence (Chromium)
        env:
          RECORDS_QA_ENGINES: chromium
          RECORDS_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/records/chromium
        run: npm run qa:records

      - name: Capture Issue 156 physical-width TAKUYA audio route (Chromium)
        env:
          P5_QA_SCOPE: battle-audio
          P5_QA_ENGINES: chromium
          P5_QA_VIEWPORTS: 667x375,736x414
          P5_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/boss-audio/chromium
        run: npm run qa:p5

      - name: Capture Version 0.9.9.5 enemy runtime and station final-canvas evidence
        env:
          V0995_ENEMY_QA_ENGINES: chromium
          V0995_ENEMY_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue165-evidence/enemy-runtime
          V0995_ENEMY_QA_COMPACT_DIR: ${{ github.workspace }}/issue165-evidence/enemy-runtime/compact
          V0995_VISUAL_QA_ENGINES: chromium
          V0995_VISUAL_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue165-evidence/visual-integrity
        run: |
          node scripts/run-browser-qa-with-server.mjs scripts/v0995-enemy-runtime-browser-smoke.mjs
          node scripts/run-browser-qa-with-server.mjs scripts/v0995-visual-integrity-browser-smoke.mjs

      - name: Upload Issue 165 visual remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue165-visual-remediation-evidence
          path: issue165-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload Issue 156 remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue156-remediation-evidence-chromium
          path: issue156-evidence
          if-no-files-found: error
          retention-days: 14

  webkit-hosted:
    name: WebKit Hosted Runner Evidence
    needs: webkit-enemy-runtime-shard
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout synthetic PR merge
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Install focused browser engine
        run: npx playwright install --with-deps webkit

      - name: Capture Issue 156 safe-area, portrait, and metadata evidence (WebKit)
        if: always()
        env:
          ISSUE156_REMEDIATION_QA_ENGINES: webkit
          ISSUE156_REMEDIATION_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/presentation/webkit
        run: npm run qa:issue156-remediation

      - name: Capture Issue 156 physical-width records evidence (WebKit)
        if: always()
        env:
          RECORDS_QA_ENGINES: webkit
          RECORDS_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/records/webkit
        run: npm run qa:records

      - name: Capture Version 0.9.9.5 station final-canvas evidence (WebKit)
        env:
          V0995_VISUAL_QA_ENGINES: webkit
          V0995_VISUAL_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue165-evidence/visual-integrity/webkit
        run: node scripts/run-browser-qa-with-server.mjs scripts/v0995-visual-integrity-browser-smoke.mjs

      - name: Upload Issue 165 WebKit visual remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue165-webkit-visual-remediation-evidence
          path: issue165-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload Issue 156 WebKit hosted-runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue156-webkit-hosted-runner-evidence
          path: issue156-evidence
          if-no-files-found: error
          retention-days: 14

  webkit-enemy-runtime-shard:
    name: WebKit Enemy Runtime Evidence (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard:
          - name: "01"
            kinds: "walker runner spitter crusher"
          - name: "02"
            kinds: "shade abomination turned takuya"
          - name: "03"
            kinds: "grappler ooze sprinter gate-eater"
          - name: "04"
            kinds: "kurome mother ooguchi gairen"
          - name: "05"
            kinds: "futago resonator cagewalker spindle"
          - name: "06"
            kinds: "choir-knot pall-manta anchor-bloom"

    steps:
      - name: Checkout synthetic PR merge
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Install focused browser engine
        run: npx playwright install --with-deps webkit

      - name: Capture Version 0.9.9.5 enemy runtime evidence (WebKit shard ${{ matrix.shard.name }})
        env:
          V0995_ENEMY_QA_ENGINES: webkit
          V0995_ENEMY_QA_SHARD_KINDS: ${{ matrix.shard.kinds }}
        run: |
          set -euo pipefail
          viewports=(844x340 844x390 1280x720)
          for kind in $V0995_ENEMY_QA_SHARD_KINDS; do
            for viewport in "${viewports[@]}"; do
              export V0995_ENEMY_QA_KINDS="$kind"
              export V0995_ENEMY_QA_VIEWPORTS="$viewport"
              export V0995_ENEMY_QA_EVIDENCE_DIR="${{ github.workspace }}/issue165-evidence/enemy-runtime/webkit/${{ matrix.shard.name }}/$kind/$viewport"
              node scripts/run-v0995-enemy-runtime-bounded.mjs
            done
          done

      - name: Upload Issue 165 WebKit enemy runtime evidence (${{ matrix.shard.name }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue165-webkit-enemy-runtime-${{ matrix.shard.name }}
          path: issue165-evidence
          if-no-files-found: error
          retention-days: 14

  webkit-viewport:
    name: WebKit Canonical Viewport Evidence (${{ matrix.viewport }}, ${{ matrix.hud_state }})
    needs: webkit-deployment-viewport
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        viewport:
          - 667x375
          - 736x414
          - 844x390
          - 844x340
          - 932x430
          - 1280x720
        hud_state:
          - stage1-normal
          - five-units
          - deployment-banner
          - manual-ability-banner
          - objective-full
          - support-disabled
          - banner-bark-boss
          - stage3-boss

    steps:
      - name: Checkout synthetic PR merge
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Install focused browser engine
        run: npx playwright install --with-deps webkit

      - name: Capture canonical HUD evidence
        env:
          DEBUG: pw:browser
          ISSUE156_WEBKIT_HUD_EVIDENCE_ROOT: ${{ github.workspace }}/issue156-viewport-evidence/canonical/hud/${{ matrix.hud_state }}
          ISSUE156_WEBKIT_HUD_STATE: ${{ matrix.hud_state }}
          V099_FINAL_REMEDIATION_QA_ENGINES: webkit
          V099_FINAL_REMEDIATION_QA_VIEWPORTS: ${{ matrix.viewport }}
          V099_FINAL_REMEDIATION_QA_TIMEOUT_MS: "60000"
        run: node scripts/run-v099-hud-states-bounded.mjs

      - name: Upload canonical WebKit viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue156-webkit-hud-${{ matrix.viewport }}-${{ matrix.hud_state }}
          path: issue156-viewport-evidence
          if-no-files-found: error
          retention-days: 14

  webkit-deployment-viewport:
    name: WebKit Deployment Viewport Evidence (${{ matrix.viewport }})
    needs: webkit-stage3-audio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        viewport:
          - 667x375
          - 736x414
          - 844x390
          - 844x340
          - 932x430
          - 1280x720
    steps:
      - name: Checkout synthetic PR merge
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production application
        run: npm run build
      - name: Install focused browser engine
        run: npx playwright install --with-deps webkit
      - name: Capture final-canvas deployment evidence
        env:
          DEBUG: pw:browser
          ISSUE156_WEBKIT_DEPLOYMENT_EVIDENCE_ROOT: ${{ github.workspace }}/issue156-viewport-evidence/canonical/deployment
          V099_FINAL_REMEDIATION_QA_ENGINES: webkit
          V099_FINAL_REMEDIATION_QA_VIEWPORTS: ${{ matrix.viewport }}
          V099_FINAL_REMEDIATION_QA_TIMEOUT_MS: "60000"
        run: node scripts/run-v099-deployment-units-bounded.mjs
      - name: Upload canonical WebKit deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue156-webkit-deployment-${{ matrix.viewport }}
          path: issue156-viewport-evidence
          if-no-files-found: error
          retention-days: 14

  webkit-stage3-audio:
    name: WebKit Stage 3 Audio Route (${{ matrix.audio_case }})
    needs: webkit-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        audio_case:
          - entrance-candidate
          - final-candidate
          - final-base

    steps:
      - name: Checkout synthetic PR merge
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build candidate production application
        if: matrix.audio_case != 'final-base'
        run: npm run build

      - name: Install focused browser engine
        run: npx playwright install --with-deps webkit

      - name: Capture bounded candidate Stage 3 audio route
        if: matrix.audio_case != 'final-base'
        env:
          P5_QA_SCOPE: battle-audio
          P5_QA_ENGINES: webkit
          P5_QA_VIEWPORTS: 736x414
          P5_QA_BATTLE_AUDIO_CASES: ${{ startsWith(matrix.audio_case, 'entrance') && 'entrance' || 'final' }}
          P5_QA_TIMEOUT_MS: "60000"
          P5_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-stage3-audio/${{ matrix.audio_case }}
        run: |
          timeout --signal=TERM --kill-after=30s 15m node scripts/run-stage3-audio-bounded.mjs

      - name: Build exact PR base for the same bounded final fixture
        if: matrix.audio_case == 'final-base'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_source="$RUNNER_TEMP/stage3-final-base"
          git worktree add --detach "$base_source" "$PR_BASE_SHA"
          (
            cd "$base_source"
            npm ci
            npm run build
          )

      - name: Capture exact-base bounded Stage 3 final route
        if: matrix.audio_case == 'final-base'
        env:
          P5_QA_SCOPE: battle-audio
          P5_QA_ENGINES: webkit
          P5_QA_VIEWPORTS: 736x414
          P5_QA_BATTLE_AUDIO_CASES: final
          P5_QA_TIMEOUT_MS: "60000"
          P5_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-stage3-audio/final-base
        run: timeout --signal=TERM --kill-after=30s 15m node scripts/run-stage3-audio-bounded.mjs "$RUNNER_TEMP/stage3-final-base"

      - name: Upload bounded Stage 3 audio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue156-webkit-stage3-audio-${{ matrix.audio_case }}
          path: issue156-stage3-audio
          if-no-files-found: error
          retention-days: 14
