name: CI

on:
  pull_request:
    branches:
      - main
      - "integration/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: PR Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout synthetic PR merge
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify PR provenance
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PR_BASE_SHA"
          test -n "$PR_HEAD_SHA"
          case "$PR_BASE_REF" in
            main|integration/*) ;;
            *) echo "unsupported PR base ref: $PR_BASE_REF" >&2; exit 1 ;;
          esac
          PR_MERGE_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$PR_BASE_SHA" "$PR_MERGE_SHA"
          git merge-base --is-ancestor "$PR_HEAD_SHA" "$PR_MERGE_SHA"
          {
            echo "base_ref=$PR_BASE_REF"
            echo "base_sha=$PR_BASE_SHA"
            echo "head_sha=$PR_HEAD_SHA"
            echo "merge_sha=$PR_MERGE_SHA"
          } | tee pr-provenance.txt

      - name: Upload PR provenance
        uses: actions/upload-artifact@v4
        with:
          name: pr-verify-provenance
          path: pr-provenance.txt
          if-no-files-found: error
          retention-days: 14

      - name: Check patch whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run lint

      - name: Validate production content
        run: npm run content:validate

      - name: Test
        run: npm test
