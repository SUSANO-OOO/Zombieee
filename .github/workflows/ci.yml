name: CI

on:
  pull_request:
    branches:
      - main
      - "integration/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: PR Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout synthetic PR merge
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify PR provenance
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PR_BASE_SHA"
          test -n "$PR_HEAD_SHA"
          case "$PR_BASE_REF" in
            main|integration/*) ;;
            *) echo "unsupported PR base ref: $PR_BASE_REF" >&2; exit 1 ;;
          esac
          PR_MERGE_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$PR_BASE_SHA" "$PR_MERGE_SHA"
          git merge-base --is-ancestor "$PR_HEAD_SHA" "$PR_MERGE_SHA"
          {
            echo "base_ref=$PR_BASE_REF"
            echo "base_sha=$PR_BASE_SHA"
            echo "head_sha=$PR_HEAD_SHA"
            echo "merge_sha=$PR_MERGE_SHA"
          } | tee pr-provenance.txt

      - name: Upload PR provenance
        uses: actions/upload-artifact@v4
        with:
          name: pr-verify-provenance
          path: pr-provenance.txt
          if-no-files-found: error
          retention-days: 14

      - name: Check patch whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run lint

      - name: Validate production content
        run: npm run content:validate

      - name: Build production application
        run: npm run build

      - name: Test
        run: npm test

      - name: Install focused browser engines
        run: npx playwright install --with-deps chromium

      - name: Build exact base and candidate PWA sites for partial-update QA
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          old_source="$RUNNER_TEMP/pwa-old-source"
          old_site="$RUNNER_TEMP/pwa-old-site"
          git worktree add --detach "$old_source" "$PR_BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$old_source/node_modules"

          (
            cd "$old_source"
            npm run build
            old_version="$(node --input-type=module --eval 'import("./app/releaseIdentity.js").then(({ RELEASE_VERSION }) => process.stdout.write(RELEASE_VERSION))')"
            GITHUB_PAGES_BASE_PATH=/Zombieee \
            GITHUB_PAGES_RELEASE_VERSION="$old_version" \
            GITHUB_PAGES_RELEASE_SHA="$PR_BASE_SHA" \
            GITHUB_PAGES_REQUEST_ID=pr-partial-update-old \
            GITHUB_PAGES_ISSUE_NUMBER=156 \
              node scripts/build-github-pages.mjs
          )
          cp -a "$old_source/_site" "$old_site"

          candidate_version="$(node --input-type=module --eval 'import("./app/releaseIdentity.js").then(({ RELEASE_VERSION }) => process.stdout.write(RELEASE_VERSION))')"
          GITHUB_PAGES_BASE_PATH=/Zombieee \
          GITHUB_PAGES_RELEASE_VERSION="$candidate_version" \
          GITHUB_PAGES_RELEASE_SHA="$PR_HEAD_SHA" \
          GITHUB_PAGES_REQUEST_ID=pr-partial-update-candidate \
          GITHUB_PAGES_ISSUE_NUMBER=156 \
            node scripts/build-github-pages.mjs

      - name: Reproduce and recover the partial-failed existing PWA (Chromium)
        env:
          PWA_PARTIAL_UPDATE_OLD_ROOT: ${{ runner.temp }}/pwa-old-site
          PWA_PARTIAL_UPDATE_CANDIDATE_ROOT: ${{ github.workspace }}/_site
          PWA_PARTIAL_UPDATE_BROWSER: chromium
          PWA_PARTIAL_UPDATE_OLD_VERSION: 0.9.9.2
          PWA_PARTIAL_UPDATE_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/pwa-partial-update/chromium
        run: npm run qa:pwa-partial-update

      - name: Capture Issue 156 canonical HUD evidence (Chromium)
        env:
          V099_FINAL_REMEDIATION_QA_ENGINES: chromium
          V099_FINAL_REMEDIATION_QA_VIEWPORTS: 667x375,736x414,844x390,844x340,1280x720
          V099_FINAL_REMEDIATION_QA_CASES: hud
          V099_FINAL_REMEDIATION_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/canonical-hud/chromium
        run: node scripts/run-browser-qa-with-server.mjs scripts/v099-final-remediation-browser-smoke.mjs

      - name: Capture Issue 156 final-canvas deployment evidence (Chromium)
        env:
          V099_FINAL_REMEDIATION_QA_ENGINES: chromium
          V099_FINAL_REMEDIATION_QA_VIEWPORTS: 667x375,736x414,844x390,844x340,1280x720
          V099_FINAL_REMEDIATION_QA_CASES: deployment
          V099_FINAL_REMEDIATION_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/deployment/chromium
        run: node scripts/run-browser-qa-with-server.mjs scripts/v099-final-remediation-browser-smoke.mjs

      - name: Capture Issue 156 safe-area, portrait, and metadata evidence
        env:
          ISSUE156_REMEDIATION_QA_ENGINES: chromium
          ISSUE156_REMEDIATION_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/presentation
        run: npm run qa:issue156-remediation

      - name: Capture Issue 156 physical-width records evidence (Chromium)
        env:
          RECORDS_QA_ENGINES: chromium
          RECORDS_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/records/chromium
        run: npm run qa:records

      - name: Capture Issue 156 physical-width TAKUYA audio route (Chromium)
        env:
          P5_QA_SCOPE: battle-audio
          P5_QA_ENGINES: chromium
          P5_QA_VIEWPORTS: 667x375,736x414
          P5_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/boss-audio/chromium
        run: npm run qa:p5

      - name: Upload Issue 156 remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue156-remediation-evidence-chromium
          path: issue156-evidence
          if-no-files-found: error
          retention-days: 14

  webkit-hosted:
    name: WebKit Hosted Runner Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout synthetic PR merge
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Install focused browser engine
        run: npx playwright install --with-deps webkit

      - name: Prepare Issue 156 WebKit exit diagnostics
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/issue156-webkit-diagnostic.sh" <<'BASH'
          #!/usr/bin/env bash
          set +e
          evidence_dir="$V099_FINAL_REMEDIATION_QA_EVIDENCE_DIR"
          mkdir -p "$evidence_dir"

          capture_resources() {
            label="$1"
            root="$evidence_dir/runner-resources-$label"
            mkdir -p "$root"
            date -u +"%Y-%m-%dT%H:%M:%SZ" > "$root/captured-at.txt" 2>&1 || true
            cat /proc/meminfo > "$root/proc-meminfo.txt" 2>&1 \
              || echo "UNAVAILABLE /proc/meminfo" > "$root/proc-meminfo.txt"
            df -h > "$root/df-h.txt" 2>&1 || true
            ulimit -a > "$root/ulimit-a.txt" 2>&1 || true
            ps -eo pid,ppid,stat,etime,rss,cmd \
              | grep -Ei '[n]ode|[Ww]ebKit|[Pp]laywright' \
              > "$root/relevant-processes.txt" 2>&1 || true
            for resource in memory.current memory.max memory.peak memory.events \
              memory.events.local memory.swap.current memory.swap.max; do
              if [ -r "/sys/fs/cgroup/$resource" ]; then
                cat "/sys/fs/cgroup/$resource" > "$root/$resource" 2>&1 || true
              else
                echo "UNAVAILABLE /sys/fs/cgroup/$resource" > "$root/$resource"
              fi
            done
          }

          capture_resources before
          DEBUG=pw:browser node scripts/run-browser-qa-with-server.mjs \
            scripts/v099-final-remediation-browser-smoke.mjs \
            2>&1 | tee "$evidence_dir/playwright-browser.log"
          qa_status=${PIPESTATUS[0]}
          capture_resources after

          {
            for counter in oom oom_kill; do
              before="$(awk -v key="$counter" \
                '$1 == key { print $2; found=1 } END { if (!found) print "unavailable" }' \
                "$evidence_dir/runner-resources-before/memory.events")"
              after="$(awk -v key="$counter" \
                '$1 == key { print $2; found=1 } END { if (!found) print "unavailable" }' \
                "$evidence_dir/runner-resources-after/memory.events")"
              delta=unavailable
              if [[ "$before" =~ ^[0-9]+$ && "$after" =~ ^[0-9]+$ ]]; then
                delta=$((after - before))
              fi
              printf '%s before=%s after=%s delta=%s\n' "$counter" "$before" "$after" "$delta"
            done
          } > "$evidence_dir/oom-delta.txt"
          printf 'qa_exit_code=%s\n' "$qa_status" > "$evidence_dir/qa-exit-code.txt"
          exit "$qa_status"
          BASH
          chmod +x "$RUNNER_TEMP/issue156-webkit-diagnostic.sh"

      - name: Capture Issue 156 canonical HUD evidence (WebKit 844x390)
        if: always()
        env:
          V099_FINAL_REMEDIATION_QA_ENGINES: webkit
          V099_FINAL_REMEDIATION_QA_VIEWPORTS: 844x390
          V099_FINAL_REMEDIATION_QA_CASES: hud
          V099_FINAL_REMEDIATION_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/canonical-hud/webkit-844x390
        run: "$RUNNER_TEMP/issue156-webkit-diagnostic.sh"

      - name: Capture Issue 156 canonical HUD evidence (WebKit 844x340)
        if: always()
        env:
          V099_FINAL_REMEDIATION_QA_ENGINES: webkit
          V099_FINAL_REMEDIATION_QA_VIEWPORTS: 844x340
          V099_FINAL_REMEDIATION_QA_CASES: hud
          V099_FINAL_REMEDIATION_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/canonical-hud/webkit-844x340
        run: "$RUNNER_TEMP/issue156-webkit-diagnostic.sh"

      - name: Capture Issue 156 canonical HUD evidence (WebKit 1280x720)
        if: always()
        env:
          V099_FINAL_REMEDIATION_QA_ENGINES: webkit
          V099_FINAL_REMEDIATION_QA_VIEWPORTS: 1280x720
          V099_FINAL_REMEDIATION_QA_CASES: hud
          V099_FINAL_REMEDIATION_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/canonical-hud/webkit-1280x720
        run: "$RUNNER_TEMP/issue156-webkit-diagnostic.sh"

      - name: Capture Issue 156 final-canvas deployment evidence (WebKit 844x390)
        if: always()
        env:
          V099_FINAL_REMEDIATION_QA_ENGINES: webkit
          V099_FINAL_REMEDIATION_QA_VIEWPORTS: 844x390
          V099_FINAL_REMEDIATION_QA_CASES: deployment
          V099_FINAL_REMEDIATION_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/deployment/webkit-844x390
        run: "$RUNNER_TEMP/issue156-webkit-diagnostic.sh"

      - name: Capture Issue 156 final-canvas deployment evidence (WebKit 844x340)
        if: always()
        env:
          V099_FINAL_REMEDIATION_QA_ENGINES: webkit
          V099_FINAL_REMEDIATION_QA_VIEWPORTS: 844x340
          V099_FINAL_REMEDIATION_QA_CASES: deployment
          V099_FINAL_REMEDIATION_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/deployment/webkit-844x340
        run: "$RUNNER_TEMP/issue156-webkit-diagnostic.sh"

      - name: Capture Issue 156 final-canvas deployment evidence (WebKit 1280x720)
        if: always()
        env:
          V099_FINAL_REMEDIATION_QA_ENGINES: webkit
          V099_FINAL_REMEDIATION_QA_VIEWPORTS: 1280x720
          V099_FINAL_REMEDIATION_QA_CASES: deployment
          V099_FINAL_REMEDIATION_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/deployment/webkit-1280x720
        run: "$RUNNER_TEMP/issue156-webkit-diagnostic.sh"

      - name: Capture Issue 156 safe-area, portrait, and metadata evidence (WebKit)
        if: always()
        env:
          ISSUE156_REMEDIATION_QA_ENGINES: webkit
          ISSUE156_REMEDIATION_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/presentation/webkit
        run: npm run qa:issue156-remediation

      - name: Capture Issue 156 physical-width records evidence (WebKit)
        if: always()
        env:
          RECORDS_QA_ENGINES: webkit
          RECORDS_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-evidence/records/webkit
        run: npm run qa:records

      - name: Upload Issue 156 WebKit hosted-runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue156-webkit-hosted-runner-evidence
          path: issue156-evidence
          if-no-files-found: error
          retention-days: 14

  webkit-physical:
    name: WebKit Physical Viewport Evidence (${{ matrix.viewport }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        viewport:
          - 667x375
          - 736x414

    steps:
      - name: Checkout synthetic PR merge
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Install focused browser engine
        run: npx playwright install --with-deps webkit

      - name: Capture physical-width HUD and deployment evidence
        env:
          DEBUG: pw:browser
          V099_FINAL_REMEDIATION_QA_ENGINES: webkit
          V099_FINAL_REMEDIATION_QA_VIEWPORTS: ${{ matrix.viewport }}
          V099_FINAL_REMEDIATION_QA_CASES: hud,deployment
          V099_FINAL_REMEDIATION_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-physical-evidence/canonical
        run: node scripts/run-browser-qa-with-server.mjs scripts/v099-final-remediation-browser-smoke.mjs

      - name: Capture physical-width TAKUYA audio route
        env:
          P5_QA_SCOPE: battle-audio
          P5_QA_ENGINES: webkit
          P5_QA_VIEWPORTS: ${{ matrix.viewport }}
          P5_QA_EVIDENCE_DIR: ${{ github.workspace }}/issue156-physical-evidence/boss-audio
        run: npm run qa:p5

      - name: Upload physical-width WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue156-webkit-physical-${{ matrix.viewport }}
          path: issue156-physical-evidence
          if-no-files-found: error
          retention-days: 14
