name: Native Game Capture Diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact diagnostic commit; no product or release acceptance
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-canvas-primitive-${{ inputs.expected_head }}
  cancel-in-progress: false
jobs:
  canvas-primitives:
    name: Native canvas primitive runtime comparison
    runs-on: macos-15-intel
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      V177_PRIMITIVE_OUT: outputs/native-canvas-primitive
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact diagnostic commit
        run: |
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Install both existing pinned WebKit runtimes
        run: |
          npm ci --prefix scripts/pwa-native-runtime
          node node_modules/playwright/cli.js install webkit
          node scripts/pwa-native-runtime/node_modules/playwright/cli.js install webkit
      - name: Observe native blank and identical Canvas2D primitives
        run: node scripts/v177-native-canvas-primitive-diagnostic.mjs
      - name: Preserve all native primitive observations and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-canvas-primitive-diagnostic
          path: outputs/native-canvas-primitive
          if-no-files-found: error
          retention-days: 14
