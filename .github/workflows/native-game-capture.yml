name: Native Game Capture Diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact isolated diagnostic commit; no normal-play or release acceptance
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: normal-s14-cpu-diagnostic-${{ inputs.expected_head }}
  cancel-in-progress: false
jobs:
  context-recording-control:
    name: Native S14 callback and draw cost diagnostic
    runs-on: macos-15-intel
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      GITHUB_PAGES_RELEASE_SHA: ${{ inputs.expected_head }}
      V177_CONTEXT_RECORDING_OUT: outputs/native-context-recording-control
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable diagnostic commit
        run: |
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Install unchanged normal WebKit runtime
        run: |
          npm ci --prefix scripts/pwa-native-runtime
          node scripts/pwa-native-runtime/node_modules/playwright/cli.js install webkit
      - name: Build unchanged product once for both variants
        id: product_build
        run: npm run build
      - name: Unrecorded S14 callback timings preserving original video error and exit
        if: ${{ !cancelled() && steps.product_build.outcome == 'success' }}
        run: node scripts/v177-normal-context-recording-diagnostic.mjs unrecorded
      - name: Preserve original reports clocks failures and diagnostic sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-s14-cpu-diagnostic
          path: outputs/native-context-recording-control
          if-no-files-found: error
          retention-days: 14
