name: Five Product Corrections Capture
on:
  workflow_call:
    inputs:
      fresh:
        required: true
        type: boolean
env:
  CI_CAPTURE_FRESH: ${{ inputs.fresh && 'true' || 'false' }}
permissions:
  contents: read
concurrency:
  group: five-corrections-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  capture:
    name: Five Corrections (${{ matrix.name }})
    # Keep the original viewport, 60fps stream request and clock/deadline bounds.
    # The Intel recording control remains in Targeted Frame Performance; use
    # the formal benchmark's ARM host for the product's original AV evidence.
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {name: desktop-1, scope: desktop, part: '1'}
          - {name: desktop-2, scope: desktop, part: '2'}
          - {name: mobile390, scope: mobile390, part: all}
          - {name: mobile340, scope: mobile340, part: all}
    env:
      V177_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      V105_CAPTURE_SCOPE: ${{ matrix.scope }}
      V105_CAPTURE_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_CHECKOUT: ${{ github.event.pull_request.head.sha }}
        run: node --input-type=module -e 'import assert from "node:assert/strict";import{execFileSync}from"node:child_process";assert.match(process.env.EXPECTED_CHECKOUT??"",/^[a-f0-9]{40}$/u);assert.equal(execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),process.env.EXPECTED_CHECKOUT);'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix scripts/native-recording-runtime
      - run: node scripts/native-recording-runtime/node_modules/playwright/cli.js install webkit
      - run: npm run build
        env:
          GITHUB_PAGES_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Prepare the selected Mac recording scope
        id: capture-preparation
        run: node scripts/v100-macos-indexing-control.mjs prepare-correction-capture
      - name: Record changed real motions, abilities, Japanese names and actual game sound
        run: node scripts/v105-five-corrections-capture.mjs
      - name: Restore all original host indexing states
        if: ${{ always() && (steps.capture-preparation.outputs.prepared == 'true' || steps.capture-preparation.outcome == 'failure' || steps.capture-preparation.outcome == 'cancelled') }}
        run: node scripts/v100-macos-indexing-control.mjs restore-correction-capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v105-five-corrections-${{ matrix.name }}
          path: outputs/v105-five-corrections/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14

  result:
    if: always()
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - env:
          CAPTURE_RESULT: ${{ needs.capture.result }}
        run: test "$CAPTURE_RESULT" = success
