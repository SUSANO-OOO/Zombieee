name: Native Audio Capability Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact 40-character candidate SHA for this diagnostic
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-audio-capabilities-${{ inputs.expected_head }}
  cancel-in-progress: false

jobs:
  native-audio-capabilities:
    name: Native WebKit Static Audio Capabilities
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Verify immutable candidate before running the diagnostic
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: node --input-type=module -e 'import assert from "node:assert/strict";import{execFileSync}from"node:child_process";assert.match(process.env.EXPECTED_HEAD??"",/^[a-f0-9]{40}$/u);assert.equal(execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),process.env.EXPECTED_HEAD);'
      - run: npm ci
      - name: Verify capability-only contracts without launching a browser
        run: node --test tests/v177-native-audio-capabilities.test.mjs
      - name: Install the pinned native WebKit runtime
        run: |
          npm ci --prefix scripts/pwa-native-runtime
          node scripts/pwa-native-runtime/node_modules/playwright/cli.js install webkit
      - name: Query static capabilities without creating or playing media
        env:
          V177_EXPECTED_HEAD_SHA: ${{ inputs.expected_head }}
          V177_NATIVE_AUDIO_CAPABILITIES_OUT: outputs/v177-native-audio-capabilities
        run: node scripts/v177-native-audio-capabilities.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v177-native-audio-capabilities
          path: outputs/v177-native-audio-capabilities
          retention-days: 7
          if-no-files-found: error
