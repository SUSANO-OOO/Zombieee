name: Native Capture Comparison Diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact diagnostic revision with unchanged f7 gameplay
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-capture-comparison-${{ inputs.expected_head }}
  cancel-in-progress: false
jobs:
  native-capture-comparison:
    name: Native WebKit Capture Comparison Diagnostic
    runs-on: macos-15
    timeout-minutes: 15
    env:
      V177_EXPECTED_HEAD_SHA: ${{ inputs.expected_head }}
      GITHUB_PAGES_RELEASE_SHA: ${{ inputs.expected_head }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix scripts/native-recording-runtime
      - run: node scripts/native-recording-runtime/node_modules/playwright/cli.js install webkit
      - run: npm run build
      - run: node scripts/v105-av-clock-control.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v105-av-clock-control
          path: outputs/v105-av-clock-control
          if-no-files-found: error
          retention-days: 14
