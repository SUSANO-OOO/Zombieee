name: Isolated Vite Same Host Performance Comparison
on:
  workflow_dispatch:
    inputs:
      expected_head:
        required: true
        type: string
      comparison_base:
        required: true
        type: string
      comparison_candidate:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ops-vite-comparison-${{ inputs.expected_head }}
  cancel-in-progress: false
jobs:
  dependency-frame-comparison:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      COMPARISON_BASE: ${{ inputs.comparison_base }}
      COMPARISON_CANDIDATE: ${{ inputs.comparison_candidate }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Fixed old/new builds and four original 30-second windows on one Mac
        run: node scripts/ops-vite-performance-comparison.mjs
      - name: Restore original host state even if the comparison step stopped
        if: always()
        run: node scripts/ops-vite-performance-comparison.mjs restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-vite-performance-comparison
          path: outputs/ops-vite-performance-comparison
          if-no-files-found: error
          retention-days: 14
