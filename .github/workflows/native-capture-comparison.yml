name: Native Capture Comparison Diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact immutable S25 observation revision
        required: true
        type: string
permissions:
  contents: read
jobs:
  s25-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Bind the exact diagnostic and unchanged product trees
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict";import{execFileSync}from"node:child_process";const git=a=>execFileSync("git",a,{encoding:"utf8"}).trim();assert.equal(git(["rev-parse","HEAD"]),process.env.EXPECTED_HEAD);const paths=["app","public","package.json","package-lock.json"];for(const p of paths)assert.equal(git(["rev-parse","HEAD:"+p]),git(["rev-parse","f88084dcf3e457fb4bd63cf4313e14327eb204b3:"+p]));'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          GITHUB_PAGES_RELEASE_SHA: ${{ inputs.expected_head }}
      - name: Observe only the original S25 RPC without changing its 30-second deadline
        run: node scripts/run-browser-qa-with-server.mjs scripts/v177-representative-battles.mjs
        env:
          V100_NORMAL_PLAY_ENGINE: chromium
          V100_NORMAL_PLAY_EVIDENCE_DIR: outputs/v105-s25-protocol
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v105-s25-protocol
          path: outputs/v105-s25-protocol
          if-no-files-found: error
  native-upload-pixels:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: node scripts/verify-playwright-container-runtime.mjs --macos-arm64
      - name: Compare native dirty-rectangle and full-payload output without launching the game
        run: node scripts/v105-native-upload-pixels.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v105-native-upload-pixels
          path: outputs/v105-native-upload-pixels
          if-no-files-found: error
