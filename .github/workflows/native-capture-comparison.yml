name: Native Capture Comparison Diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact immutable S25 observation revision
        required: true
        type: string
permissions:
  contents: read
jobs:
  s25-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Bind the exact diagnostic and unchanged product trees
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict";import{execFileSync}from"node:child_process";const git=a=>execFileSync("git",a,{encoding:"utf8"}).trim();assert.equal(git(["rev-parse","HEAD"]),process.env.EXPECTED_HEAD);const paths=["app","public","package.json","package-lock.json"];for(const p of paths)assert.equal(git(["rev-parse","HEAD:"+p]),git(["rev-parse","f88084dcf3e457fb4bd63cf4313e14327eb204b3:"+p]));'
      - run: npm ci
      - run: npx playwright install chromium
      - name: Verify the unchanged Chromium runtime can launch with host libraries
        run: node --input-type=module -e 'import assert from "node:assert/strict";import{chromium}from"playwright";const b=await chromium.launch({headless:true});try{assert.equal(b.version(),"141.0.7390.37");console.log(JSON.stringify({browser:b.version(),dependencySetup:"host libraries, no apt changes",diagnosticOnly:true}));}finally{await b.close();}'
      - run: npm run build
        env:
          GITHUB_PAGES_RELEASE_SHA: ${{ inputs.expected_head }}
      - name: Observe only the original S25 RPC without changing its 30-second deadline
        run: |
          mkdir -p outputs/v105-s25-protocol
          node scripts/run-browser-qa-with-server.mjs scripts/v177-representative-battles.mjs
        env:
          V100_NORMAL_PLAY_ENGINE: chromium
          V100_NORMAL_PLAY_EVIDENCE_DIR: outputs/v105-s25-protocol
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v105-s25-protocol
          path: outputs/v105-s25-protocol
          if-no-files-found: error
