name: One original formal desktop native-call cost diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_head:
        required: true
        type: string
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
      - name: Bind the original product and three diagnostic paths
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          node --input-type=module <<'JS'
          import assert from'node:assert/strict';import{execFileSync}from'node:child_process';
          const g=a=>execFileSync('git',a,{encoding:'utf8'}).trim(),base='e87021073d7c8ab93387a4999cfedc46f467943f';
          assert.equal(g(['rev-parse','HEAD']),process.env.EXPECTED_HEAD);assert.equal(process.env.GITHUB_SHA,process.env.EXPECTED_HEAD);
          for(const p of ['app','public','assets','package.json','package-lock.json','scripts/v100-normal-tactical-input.mjs','scripts/v177-ranger-performance-receipts.mjs','scripts/v100-macos-indexing-control.mjs'])assert.equal(g(['rev-parse','HEAD:'+p]),g(['rev-parse',base+':'+p]));
          assert.deepEqual(g(['diff','--name-only',base,'HEAD']).split('\n').sort(),['.github/workflows/native-capture-comparison.yml','scripts/v100-device-runtime-browser.mjs','scripts/v105-native-canvas-cost-host.mjs']);
          JS
      - run: npm ci
      - run: npx playwright install webkit
      - run: node scripts/verify-playwright-container-runtime.mjs --macos-arm64
      - run: npm run build
        env:
          GITHUB_PAGES_RELEASE_SHA: ${{ inputs.expected_head }}
      - name: Retain the exact compiled stack source
        shell: bash
        run: |
          mkdir -p outputs/canvas-native-cost/compiled-source
          cp dist/client/assets/V100Campaign-*.js outputs/canvas-native-cost/compiled-source/
          cp dist/client/.vite/manifest.json outputs/canvas-native-cost/compiled-source/vite-manifest.json
      - name: Prepare the ephemeral diagnostic host without spoofing a PR event
        id: preparation
        run: node scripts/v105-native-canvas-cost-host.mjs prepare
      - name: Observe the single original desktop window once
        run: node scripts/run-browser-qa-with-server.mjs scripts/v100-device-runtime-browser.mjs
        env:
          V100_DEVICE_RUNTIME_ENGINE: webkit
          V100_DEVICE_RUNTIME_VIEWPORT: 1280x720
          V100_DEVICE_RUNTIME_OUT: outputs/canvas-native-cost/window
          V100_DEVICE_RUNTIME_CALLBACK_DIAGNOSTIC: '0'
          V100_DEVICE_RUNTIME_BLANK_BASELINE: '1'
      - name: Restore every original indexing state
        if: ${{ always() && (steps.preparation.outcome == 'success' || steps.preparation.outcome == 'failure' || steps.preparation.outcome == 'cancelled') }}
        run: node scripts/v105-native-canvas-cost-host.mjs restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v105-canvas-native-cost-original
          path: outputs/canvas-native-cost
          if-no-files-found: error
          retention-days: 14
