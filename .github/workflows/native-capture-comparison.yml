name: Isolated macOS Observer Capability Readout
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Immutable read-only diagnostic head
        required: true
        type: string
permissions:
  contents: read
jobs:
  observer-capabilities:
    runs-on: macos-15
    timeout-minutes: 2
    env:
      V177_EXPECTED_HEAD_SHA: ${{ inputs.expected_head }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false
      - name: Read installed observer help and manual files only
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          import os,sys,platform,subprocess,json,pathlib,gzip
          assert platform.system()=='Darwin' and platform.machine()=='arm64'
          assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
          assert os.environ['GITHUB_REPOSITORY']=='SUSANO-OOO/Zombieee'
          assert os.environ['GITHUB_JOB']=='observer-capabilities'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['V177_EXPECTED_HEAD_SHA']
          out=pathlib.Path('outputs/ops-observer-capabilities');out.mkdir(parents=True)
          report={'head':head,'run':os.environ['GITHUB_RUN_ID'],'accepted':False,'diagnosticOnly':True,
            'purpose':'Read actual CLI options before any further sampling; no browser, profiling or product validation',
            'system':platform.platform(),'python':sys.version,'manuals':[]}
          try:
            result=subprocess.run(['/usr/bin/sample','-h'],capture_output=True,text=True,timeout=5)
            report['sampleHelp']={'argv':['/usr/bin/sample','-h'],'code':result.returncode,'stdout':result.stdout,'stderr':result.stderr}
          except subprocess.TimeoutExpired as error:
            report['sampleHelp']={'timedOut':True,'stdout':str(error.stdout),'stderr':str(error.stderr)}
          for folder in ['/usr/share/man/man1','/usr/share/man/man8']:
            for name in ['sample','spindump']:
              for file in pathlib.Path(folder).glob(name+'.[18]*'):
                data=file.read_bytes();assert len(data)<=524288
                raw=gzip.decompress(data) if file.suffix=='.gz' else data
                assert len(raw)<=1048576
                dest=out/file.name.replace('.gz','')
                dest.write_bytes(raw)
                report['manuals'].append({'source':str(file),'file':dest.name,'originalCompressedBytes':len(data),'textBytes':len(raw)})
          (out/'report.json').write_text(json.dumps(report,indent=2)+'\n')
          assert not report['sampleHelp'].get('timedOut',False),'Help command timed out; no capability inferred'
          assert report['manuals'] or 'usage' in (report['sampleHelp']['stdout']+report['sampleHelp']['stderr']).lower(),'No installed documentation found'
          print(json.dumps({'head':head,'manuals':report['manuals'],'sampleHelpCode':report['sampleHelp']['code'],'accepted':False}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-observer-capabilities
          path: outputs/ops-observer-capabilities
          if-no-files-found: error
          retention-days: 14
