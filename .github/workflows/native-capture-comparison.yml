name: Isolated Instruments Self Trace Preflight
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Immutable self-only diagnostic head; no game
        required: true
        type: string
permissions:
  contents: read
jobs:
  instruments-self:
    runs-on: macos-15
    timeout-minutes: 2
    env:
      V177_EXPECTED_HEAD_SHA: ${{ inputs.expected_head }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false
      - name: Record one second of this worker and retain original trace before export
        run: /usr/bin/python3 scripts/ops-instruments-self-preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-instruments-self
          path: |
            outputs/ops-instruments-self/*.json
            outputs/ops-instruments-self/*.tar.gz
            outputs/ops-instruments-self/*.xml
          if-no-files-found: error
          retention-days: 14
