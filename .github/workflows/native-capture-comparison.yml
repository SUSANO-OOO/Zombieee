name: Mayo Static Icon Causal Diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact immutable diagnostic source SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mayo-static-icon-${{ inputs.expected_head }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      receipt_sha256: ${{ steps.bundle.outputs.receipt_sha256 }}
      dist_sha256: ${{ steps.bundle.outputs.dist_sha256 }}
    env:
      V177_EXPECTED_HEAD_SHA: ${{ inputs.expected_head }}
      GITHUB_PAGES_RELEASE_SHA: ${{ inputs.expected_head }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Verify the fixed source and narrow diagnostic delta
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import{execFileSync}from'node:child_process';
          const g=a=>execFileSync('git',a,{encoding:'utf8'}).trim(),base='45e46b90be77cd349670157974646dcc7f16b1cd';
          assert.equal(g(['rev-parse','HEAD']),process.env.V177_EXPECTED_HEAD_SHA);assert.equal(process.env.GITHUB_SHA,process.env.V177_EXPECTED_HEAD_SHA);
          assert.equal(g(['merge-base',base,'HEAD']),base);
          const files=['public/art/v105/abilities/mayo-chan-feral-ready-raster-r1.png','scripts/v177-native-allunit-browser.mjs','.github/workflows/native-capture-comparison.yml'];
          assert.deepEqual(g(['diff','--name-only',base,'HEAD']).split('\n').sort(),files.sort());
          for(const f of ['app','assets','package.json','package-lock.json','scripts/native-recording-runtime','app/audioMixer.js','scripts/v177-native-allunit-cases.mjs','scripts/v177-native-allunit-manifest.mjs','scripts/v177-native-canvas-clips.mjs','scripts/v177-native-encoded-clips.mjs'])assert.equal(g(['rev-parse','HEAD:'+f]),g(['rev-parse',base+':'+f]));
          JS
      - run: npm ci
      - run: npm run build
      - id: bundle
        run: node scripts/v177-native-allunit-build.mjs pack outputs/mayo-static-icon-build
      - uses: actions/upload-artifact@v4
        with:
          name: mayo-static-icon-build
          path: outputs/mayo-static-icon-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  observe:
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    env:
      V177_EXPECTED_HEAD_SHA: ${{ inputs.expected_head }}
      V177_EXPECTED_BUILD_RECEIPT_SHA256: ${{ needs.build.outputs.receipt_sha256 }}
      V177_EXPECTED_BUILD_SHA256: ${{ needs.build.outputs.dist_sha256 }}
      V177_CAPTURE_SHARD: forms-4
      V177_NATIVE_VIDEO_MIME: video/webm;codecs=vp8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the unchanged native ARM WebKit runtime
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict";assert.equal(process.platform,"darwin");assert.equal(process.arch,"arm64");'
          npm ci --prefix scripts/native-recording-runtime
          node scripts/native-recording-runtime/node_modules/playwright/cli.js install webkit
      - uses: actions/download-artifact@v4
        with:
          name: mayo-static-icon-build
          path: outputs/mayo-static-icon-build
      - name: Restore the identical verified recursive build once
        run: node scripts/v177-native-allunit-build.mjs restore outputs/mayo-static-icon-build outputs/mayo-static-icon/build-owner
      - name: Only the three unexecuted B1 B2 A2 conditions; retain original A1 failure
        shell: bash
        run: |
          set -euo pipefail
          for episode in b1 b2 a2; do
            if [[ "$episode" == a* ]]; then export V105_MAYO_ICON_POLICY=svg; else export V105_MAYO_ICON_POLICY=static-png; fi
            export V177_NATIVE_ALLUNIT_OUT="outputs/mayo-static-icon/$episode"
            mkdir -p "$V177_NATIVE_ALLUNIT_OUT"
            cp outputs/mayo-static-icon/build-owner/build-bundle-consumption.json "$V177_NATIVE_ALLUNIT_OUT/"
            cp outputs/mayo-static-icon/build-owner/build-bundle-receipt.json "$V177_NATIVE_ALLUNIT_OUT/"
            node scripts/v177-native-allunit-browser.mjs
            set +e
            node scripts/v177-native-encoded-clips.mjs "$V177_NATIVE_ALLUNIT_OUT/report.json"
            encoded_exit=$?
            set -e
            if [[ "$encoded_exit" -gt 1 ]]; then exit "$encoded_exit"; fi
            printf '%s\t%s\t%s\n' "$episode" "$V105_MAYO_ICON_POLICY" "$encoded_exit" >> outputs/mayo-static-icon/diagnostic-outcomes.tsv
          done
      - name: Seal diagnostic scope without converting failures into acceptance
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from'node:fs';
          const root='outputs/mayo-static-icon',episodes=['b1','b2','a2'].map(id=>{
            const f=root+'/'+id+'/report.json';if(!fs.existsSync(f))return{id,status:'unexecuted'};
            const r=JSON.parse(fs.readFileSync(f));return{id,head:r.head,policy:r.iconPolicy,status:r.status,errors:r.errors,cases:r.cases.map(c=>({caseId:c.caseId,status:c.status,clipSha256:c.nativeClip?.sha256??null})),cleanup:r.contexts.map(c=>c.cleanup)};
          });
          fs.mkdirSync(root,{recursive:true});fs.writeFileSync(root+'/diagnostic-scope.json',JSON.stringify({head:process.env.GITHUB_SHA,sourceProductBase:'45e46b90be77cd349670157974646dcc7f16b1cd',fixedOrder:'BBA continuation on this host',previousA1:{runId:40180089865,head:'da0cd8098e6a3775513f7bb54e1ca016eced5dfb',artifactId:12594386985,zipSha256:'eb7c55c0172966b30ca1678093e7af1e037cfe118566f4c81b92314600b6124b',status:'failed',sourceGapMs:913,sampleSpanMs:893,sameHost:false},episodes,qualityThresholdsUnchanged:true,deadlinesUnchanged:true,gameMixerAndCuesUnchanged:true,rawMediaUnmodified:true,allUnitAcceptance:false,formalPerformanceAcceptance:false,releaseAcceptance:false},null,2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mayo-static-icon-original
          path: outputs/mayo-static-icon
          if-no-files-found: error
          retention-days: 14
