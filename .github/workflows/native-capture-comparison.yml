name: Isolated Native Postpaint Acquisition Comparison
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact diagnostic head; not an acceptance or deployment
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ops-f5-recorder-control-${{ inputs.expected_head }}
  cancel-in-progress: false
jobs:
  f5-recorder-control:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      V177_EXPECTED_HEAD_SHA: ${{ inputs.expected_head }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: node --input-type=module -e 'import assert from "node:assert/strict";import{execFileSync}from"node:child_process";assert.equal(execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),process.env.V177_EXPECTED_HEAD_SHA);'
      - run: npm ci
      - run: npm ci --prefix scripts/native-recording-runtime
      - run: node scripts/native-recording-runtime/node_modules/playwright/cli.js install webkit
      - name: Original capture contracts and postpaint normal and abnormal controls
        run: node --test tests/v177-native-canvas-clips.test.mjs tests/v177-native-encoded-clips.test.mjs tests/v177-native-allunit.test.mjs tests/ops-native-postpaint-control.test.mjs
      - run: npm run build
        env:
          GITHUB_PAGES_RELEASE_SHA: ${{ inputs.expected_head }}
      - name: Prepare only this ephemeral host
        id: prepare
        run: node scripts/ops-f5-recorder-control.mjs prepare
      - name: One original Gate Eater condition in fixed timer-postpaint-postpaint-timer order
        run: node scripts/run-browser-qa-with-server.mjs scripts/ops-native-postpaint-control.mjs
      - name: Restore every original volume state
        if: always() && steps.prepare.outcome != 'skipped'
        run: node scripts/ops-f5-recorder-control.mjs restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-native-postpaint-control
          path: |
            outputs/ops-native-postpaint-control
            outputs/ops-f5-recorder-control/host.json
          if-no-files-found: error
          retention-days: 14
