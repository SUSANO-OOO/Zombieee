name: Native Capture Comparison Diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact immutable audit-history observation revision
        required: true
        type: string
permissions:
  contents: read
jobs:
  audit-history-control:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Bind the exact instrumentation-only revision
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import{execFileSync}from'node:child_process';import{mkdirSync,writeFileSync}from'node:fs';
          const git=a=>execFileSync('git',a,{encoding:'utf8'}).trim(),base='f88084dcf3e457fb4bd63cf4313e14327eb204b3',head=git(['rev-parse','HEAD']);assert.equal(head,process.env.EXPECTED_HEAD);
          const paths=['.github/workflows/native-capture-comparison.yml','app/AshfallGame.tsx','scripts/v100-device-runtime-browser.mjs'];assert.deepEqual(git(['diff','--name-only',base,head]).split('\n').sort(),paths.sort());
          mkdirSync('outputs/v105-audit-history-control',{recursive:true});writeFileSync('outputs/v105-audit-history-control/binding.json',JSON.stringify({base,head,sourcePins:paths.map(p=>({path:p,before:git(['rev-parse',base+':'+p]),after:git(['rev-parse',head+':'+p])})),instrumentationOnly:true,normalPlayerBehaviorChanged:false,defaultFullHistory:true,rangerHistoryLimit:128,formalAccepted:false,hostIndexingPreparation:false},null,2));
          JS
      - run: npm ci
      - run: npx playwright install webkit
      - run: node scripts/verify-playwright-container-runtime.mjs --macos-arm64
      - run: npm run build
        env:
          GITHUB_PAGES_RELEASE_SHA: ${{ inputs.expected_head }}
      - name: Original 30-second desktop windows in full-latest-latest-full order
        env:
          V100_DEVICE_RUNTIME_ENGINE: webkit
          V100_DEVICE_RUNTIME_ROLE: native-control
          V100_DEVICE_RUNTIME_CALLBACK_DIAGNOSTIC: '1'
          V100_DEVICE_RUNTIME_BLANK_BASELINE: '1'
          V100_DEVICE_RUNTIME_VIEWPORT: 1280x720
        run: |
          result=0
          sequence=0
          for mode in full latest latest full; do
            sequence=$((sequence+1))
            V100_DEVICE_RUNTIME_AUDIT_HISTORY="$mode" V100_DEVICE_RUNTIME_OUT="outputs/v105-audit-history-control/$sequence-$mode" node scripts/run-browser-qa-with-server.mjs scripts/v100-device-runtime-browser.mjs || result=1
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v105-audit-history-control
          path: outputs/v105-audit-history-control
          if-no-files-found: error
