name: Isolated macOS Raw Self Preflight
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Immutable diagnostic head; no game or product validation
        required: true
        type: string
permissions:
  contents: read
jobs:
  observer-capabilities:
    runs-on: macos-15
    timeout-minutes: 2
    env:
      V177_EXPECTED_HEAD_SHA: ${{ inputs.expected_head }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false
      - name: Collect only the worker own PID and re-report its raw data
        run: /usr/bin/python3 scripts/ops-spindump-self-preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-raw-self-preflight
          path: outputs/ops-raw-self-preflight
          if-no-files-found: error
          retention-days: 14
