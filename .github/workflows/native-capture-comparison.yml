name: Native Capture Comparison Diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact 40-character candidate SHA for this diagnostic
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-capture-comparison-${{ inputs.expected_head }}
  cancel-in-progress: false

jobs:
  native-capture-comparison:
    name: Native WebKit Capture Comparison Diagnostic
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Verify immutable candidate before running the diagnostic
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: node --input-type=module -e 'import assert from "node:assert/strict";import{execFileSync}from"node:child_process";assert.match(process.env.EXPECTED_HEAD??"",/^[a-f0-9]{40}$/u);assert.equal(execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),process.env.EXPECTED_HEAD);'
      - run: npm ci
      - name: Install the pinned native WebKit runtime
        run: |
          npm ci --prefix scripts/pwa-native-runtime
          node scripts/pwa-native-runtime/node_modules/playwright/cli.js install webkit
      - name: Compare original native canvas recording conditions
        env:
          V177_NATIVE_CAPTURE_OUT: outputs/v177-native-capture-comparison
        run: node scripts/v177-native-canvas-comparison-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v177-native-capture-comparison
          path: outputs/v177-native-capture-comparison
          retention-days: 7
