name: Native Opus Streaming Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/native-opus-streaming.yml'
      - 'scripts/v177-opus-webm-muxer.mjs'
      - 'scripts/v177-native-opus-probe.mjs'
      - 'scripts/v177-native-opus-browser.mjs'
      - 'tests/v177-opus-webm-muxer.test.mjs'
      - 'tests/v177-native-opus-probe.test.mjs'

permissions:
  contents: read

concurrency:
  group: native-opus-streaming-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  native-opus-streaming:
    name: Native WebKit 10ms Opus Streaming
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify binary and guard contracts without launching a browser
        run: node --test tests/v177-opus-webm-muxer.test.mjs tests/v177-native-opus-probe.test.mjs
      - name: Install the pinned native WebKit runtime
        run: |
          npm ci --prefix scripts/pwa-native-runtime
          node scripts/pwa-native-runtime/node_modules/playwright/cli.js install webkit
      - name: Measure short native streams without a realtime AudioContext
        env:
          V177_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          V177_NATIVE_OPUS_OUT: outputs/v177-native-opus
        run: node scripts/v177-native-opus-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v177-native-opus-streaming
          path: outputs/v177-native-opus
          retention-days: 7
          if-no-files-found: error
