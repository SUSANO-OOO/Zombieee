name: One Prewarmed Native Audio Graph Diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact 40-character candidate SHA for this diagnostic
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: v177-one-prewarmed-native-audio-graph
  cancel-in-progress: false
jobs:
  graph:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      V177_GRAPH_EXPECTED_HEAD: ${{ inputs.expected_head }}
      V177_GRAPH_OUT: outputs/v177-native-aac-graph
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify immutable candidate before running the diagnostic
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: node --input-type=module -e 'import assert from "node:assert/strict";import{execFileSync}from"node:child_process";assert.match(process.env.EXPECTED_HEAD??"",/^[a-f0-9]{40}$/u);assert.equal(execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),process.env.EXPECTED_HEAD);'
      - name: Pure callback and fault contracts only
        run: node --experimental-vm-modules --test tests/v177-native-aac-graph.test.mjs
      - name: Install the original pinned WebKit runtime only
        run: |
          npm ci --prefix scripts/pwa-native-runtime
          node scripts/pwa-native-runtime/node_modules/playwright/cli.js install webkit
      - name: One real original graph to native AAC/MSE observation
        run: node scripts/v177-native-aac-graph-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v177-one-native-audio-graph-${{ env.V177_GRAPH_EXPECTED_HEAD }}-${{ github.run_attempt }}
          path: outputs/v177-native-aac-graph
          if-no-files-found: error
          retention-days: 7