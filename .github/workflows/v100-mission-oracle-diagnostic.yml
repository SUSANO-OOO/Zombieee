name: V100 mission pixel oracle diagnostic
on:
  push:
    branches: ["codex/v100-mission-oracle-ea6"]
permissions:
  contents: read
jobs:
  diagnostic:
    name: DIAGNOSTIC ONLY mission pixel oracle
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
      - run: npm ci
      - name: Source and diagnostic contract
        run: node --test tests/diagnostic-only/v100-mission-oracle-diagnostic.test.mjs
      - run: npx playwright install chromium webkit
      - run: node scripts/verify-playwright-container-runtime.mjs --macos
      - name: Build read-only QA instrumentation candidate
        run: npm run build
      - name: One finite four-context diagnostic
        run: node scripts/run-browser-qa-with-server.mjs scripts/v100-mission-oracle-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v100-mission-oracle-diagnostic
          path: outputs/v100-mission-oracle
          if-no-files-found: error
          retention-days: 14
